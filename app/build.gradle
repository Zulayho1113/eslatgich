plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.eslatgich'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.eslatgich'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        debug {
            storeFile file('eslatgich.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
