name: APK yig'ish

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon

      - name: APK nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk Eslatgich.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eslatgich-apk
          path: Eslatgich.apk

      - name: Yuklab olish sahifasiga qo'yish (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" Eslatgich.apk \
            --title "Eslatgich v1.${{ github.run_number }}" \
            --notes "Telefoningizga shu Eslatgich.apk faylini yuklab oling va o'rnating."
